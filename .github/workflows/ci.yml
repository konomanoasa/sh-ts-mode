name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          brew install gnutls pkgconf tree-sitter

      - name: Cache Emacs
        id: emacs-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/emacs-31.1
          key: ${{ runner.os }}-${{ runner.arch }}-emacs-31.1-v1

      - name: Build Emacs 31.1
        if: steps.emacs-cache.outputs.cache-hit != 'true'
        run: |
          archive=/tmp/emacs-31.1.tar.xz
          source_directory=$(mktemp -d)
          curl --fail --location --silent --show-error \
            https://ftp.gnu.org/gnu/emacs/emacs-31.1.tar.xz \
            --output "$archive"
          echo "1da5790d9580c81932b5bf700633114468da7b3412d69faa767daebf974f4586  $archive" \
            | shasum -a 256 --check
          tar -xf "$archive" -C "$source_directory" --strip-components=1
          cd "$source_directory"
          export PKG_CONFIG_PATH="$(brew --prefix tree-sitter)/lib/pkgconfig:$(brew --prefix gnutls)/lib/pkgconfig"
          ./configure \
            --prefix="$HOME/.local/emacs-31.1" \
            --without-dbus \
            --without-native-compilation \
            --without-ns \
            --without-sound \
            --without-x \
            --with-tree-sitter
          make -j2
          make install

      - name: Check
        run: |
          emacs="$HOME/.local/emacs-31.1/bin/emacs"
          mkdir -p "$RUNNER_TEMP/emacs.d"
          "$emacs" -Q --batch \
            --eval "(setq user-emacs-directory \"$RUNNER_TEMP/emacs.d/\" package-user-dir \"$RUNNER_TEMP/emacs.d/elpa\")" \
            --eval '(require (quote package))' \
            --eval '(add-to-list (quote package-archives) (quote ("melpa" . "https://melpa.org/packages/")) t)' \
            --eval '(package-refresh-contents)' \
            --eval '(package-install (quote package-lint))'
          "$emacs" -Q --batch \
            --eval "(setq user-emacs-directory \"$RUNNER_TEMP/emacs.d/\" package-user-dir \"$RUNNER_TEMP/emacs.d/elpa\")" \
            --eval '(require (quote package))' \
            --eval '(package-initialize)' \
            -l package-lint \
            --eval '(setq package-lint-emacs-head-version (quote (32)))' \
            -f package-lint-batch-and-exit \
            sh-ts-mode.el
          "$emacs" -Q --batch \
            -l checkdoc \
            --eval '(find-file "sh-ts-mode.el")' \
            -f checkdoc-batch
          "$emacs" -Q --batch -L . \
            --eval '(progn (require (quote bytecomp)) (setq byte-compile-error-on-warn t))' \
            -f batch-byte-compile \
            sh-ts-mode.el
          "$emacs" -Q --batch -L . \
            --eval "(setq user-emacs-directory \"$RUNNER_TEMP/emacs.d/\")" \
            -l sh-ts-mode \
            --eval '(let ((treesit-auto-install-grammar (quote always))) (dolist (language (quote (sh))) (unless (sh-ts-mode--ensure-grammar language) (error "Cannot install the %s grammar" language))))'
          "$emacs" -Q --batch -L . -L test \
            --eval "(setq user-emacs-directory \"$RUNNER_TEMP/emacs.d/\")" \
            -l test/sh-ts-mode-test.el \
            -f ert-run-tests-batch-and-exit
